name: Zaimanhua Daily Tasks

on:
  schedule:
    # 北京时间每天 08:00
    - cron: "0 0 * * *"
    # 北京时间每天 09:30
    - cron: "30 1 * * *"
    # 北京时间每天 10:00
    - cron: "0 2 * * *"
    # 北京时间每天 11:00
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run task
        env:
          ZAIMANHUA_COOKIE: ${{ secrets.ZAIMANHUA_COOKIE }}
        run: |
          HOUR=$(date -u +"%H:%M")

          if [ "$HOUR" = "00:00" ]; then
            python src/checkin.py
          elif [ "$HOUR" = "01:30" ]; then
            python src/comment.py
          elif [ "$HOUR" = "02:00" ]; then
            python src/auto_read.py
          elif [ "$HOUR" = "03:00" ]; then
            python src/lottery.py
          else
            echo "Manual run: running check-in"
            python src/checkin.py
          fi
